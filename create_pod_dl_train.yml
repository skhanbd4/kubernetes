apiVersion: v1
kind: Pod
metadata:
  name: sknnh-dl-train
spec:
  containers:
  - name: sknnh-dl-train
    image: gitlab-registry.nrp-nautilus.io/skhan/dl_pytorch:4bd8b3be
    workingDir: /sknnh-dl-train  # Updated working directory
    command: ["jupyter", "notebook", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--NotebookApp.token=''", "--NotebookApp.notebook_dir=/sknnh-dl-train"]  # Updated notebook directory
    resources:
      limits:
        memory: 12Gi
        cpu: 2
        nvidia.com/gpu: 1
      requests:
        memory: 12Gi
        cpu: 2
        nvidia.com/gpu: 1
    volumeMounts:
    - mountPath: /sknnh-dl-train  # Updated PVC mount path
      name: sknnh-dl-train  # Updated PVC name
    - name: dshm
      mountPath: /dev/shm
  volumes:
    - name: sknnh-dl-train  # Updated PVC volume name
      persistentVolumeClaim:
        claimName: sknnh-dl-train  # Updated PVC claim name
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 10Gi
