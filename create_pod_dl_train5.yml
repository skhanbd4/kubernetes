apiVersion: v1
kind: Pod
metadata:
  name: sknnh-dl-train
  labels:
    app: sknnh-dl-train
spec:
  enableServiceLinks: false
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
  initContainers:
  - name: fix-perms
    image: busybox:1.36
    command: ["sh", "-lc", "chown -R 1000:1000 /sknnh-dl-train || true; chmod -R g+rwX /sknnh-dl-train || true"]
    volumeMounts:
      - name: sknnh-dl-train
        mountPath: /sknnh-dl-train
  containers:
  - name: sknnh-dl-train
    image: gitlab-registry.nrp-nautilus.io/skhan/dl_pytorch:4bd8b3be
    imagePullPolicy: IfNotPresent
    workingDir: /sknnh-dl-train
    ports:
      - containerPort: 8888
        name: http
        protocol: TCP
    # Use JupyterLab and ServerApp flags (newer Jupyter). Non-root so no --allow-root needed.
    command: ["bash", "-lc", "exec jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --ServerApp.token='' --ServerApp.password='' --ServerApp.allow_origin='*' --ServerApp.root_dir=/sknnh-dl-train"]
    env:
      - name: PIP_NO_CACHE_DIR
        value: "1"
      - name: TORCH_HOME
        value: /sknnh-dl-train/.cache/torch
      - name: HF_HOME
        value: /sknnh-dl-train/.cache/huggingface
      - name: TRANSFORMERS_CACHE
        value: /sknnh-dl-train/.cache/huggingface/transformers
      - name: MPLCONFIGDIR
        value: /sknnh-dl-train/.cache/matplotlib
      - name: JUPYTER_RUNTIME_DIR
        value: /sknnh-dl-train/.cache/jupyter/runtime
      - name: JUPYTER_DATA_DIR
        value: /sknnh-dl-train/.cache/jupyter/data
      - name: XDG_CACHE_HOME
        value: /sknnh-dl-train/.cache
    resources:
      requests:
        cpu: "2"
        memory: "12Gi"
        ephemeral-storage: "10Gi"
        nvidia.com/gpu: 1
      limits:
        cpu: "2"
        memory: "12Gi"
        ephemeral-storage: "12Gi"
        nvidia.com/gpu: 1
    volumeMounts:
      - name: sknnh-dl-train
        mountPath: /sknnh-dl-train
      - name: dshm
        mountPath: /dev/shm
      - name: tmpdir
        mountPath: /tmp
  volumes:
    - name: sknnh-dl-train
      persistentVolumeClaim:
        claimName: sknnh-dl-train
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 12Gi
    - name: tmpdir
      emptyDir:
        sizeLimit: 2Gi
