apiVersion: v1
kind: Pod
metadata:
  name: sknnh-dl-train
  labels:
    app: sknnh-dl-train
spec:
  enableServiceLinks: false
  terminationGracePeriodSeconds: 30
  containers:
  - name: sknnh-dl-train
    image: gitlab-registry.nrp-nautilus.io/skhan/dl_pytorch:4bd8b3be
    imagePullPolicy: IfNotPresent
    workingDir: /sknnh-dl-train
    command: ["bash", "-lc", "jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --NotebookApp.token='' --NotebookApp.password='' --NotebookApp.allow_origin='*' --NotebookApp.notebook_dir=/sknnh-dl-train"]
    env:
      - name: PIP_NO_CACHE_DIR
        value: "1"
      - name: TORCH_HOME
        value: /sknnh-dl-train/.cache/torch
      - name: HF_HOME
        value: /sknnh-dl-train/.cache/huggingface
      - name: TRANSFORMERS_CACHE
        value: /sknnh-dl-train/.cache/huggingface/transformers
      - name: MPLCONFIGDIR
        value: /sknnh-dl-train/.cache/matplotlib
      - name: JUPYTER_RUNTIME_DIR
        value: /sknnh-dl-train/.cache/jupyter/runtime
      - name: JUPYTER_DATA_DIR
        value: /sknnh-dl-train/.cache/jupyter/data
      - name: XDG_CACHE_HOME
        value: /sknnh-dl-train/.cache
    resources:
      requests:
        cpu: "2"
        memory: "12Gi"
        ephemeral-storage: "10Gi"
        nvidia.com/gpu: 1
      limits:
        cpu: "2"
        memory: "12Gi"
        ephemeral-storage: "12Gi"
        nvidia.com/gpu: 1
    volumeMounts:
      - name: sknnh-dl-train
        mountPath: /sknnh-dl-train
      - name: dshm
        mountPath: /dev/shm
      - name: tmpdir
        mountPath: /tmp
  volumes:
    - name: sknnh-dl-train
      persistentVolumeClaim:
        claimName: sknnh-dl-train
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 12Gi
    - name: tmpdir
      emptyDir:
        sizeLimit: 2Gi
