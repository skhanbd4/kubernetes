name: dltorch
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.11
  - pip

  # Core numerics / DS
  - numpy=1.26.4
  - scipy=1.11.4
  - pandas=2.2.2
  - scikit-learn=1.4.2
  - h5py=3.11.0
  - openpyxl=3.1.5
  - pyyaml=6.0.1
  - jinja2=3.1.4
  - markdown=3.6

  # Viz / notebook
  - matplotlib=3.8.4
  - seaborn=0.13.2
  - notebook=7.2.2

  # Geo / raster stack (mutually compatible on conda-forge)
  - geopandas=0.14.4
  - shapely=2.0.4
  - pyproj=3.6.1
  - rtree=1.3.0
  - rasterio=1.3.10
  - fiona=1.9.6
  - rioxarray=0.15.5
  - xarray=2024.7.0
  - netcdf4=1.7.1
  - geojson=3.0.1

  # System graphviz (for python-graphviz / torchviz)
  - graphviz

  # PyTorch + CUDA 11.8 (works with GTX 1060)
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.8

  # pip-only extras
  - pip:
      - opencv-python-headless==4.10.0.84
      - torchviz==0.0.2
      - graphviz==0.20.3
      - jsonlib-python3==1.6.1
      - sentinelhub==3.10.2
      - transformers==4.44.2
      - timm==1.0.7
      - einops==0.8.0

